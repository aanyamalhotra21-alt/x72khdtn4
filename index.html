<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I got a Co-op!</title>
<style>
  :root {
    --bg: #fdf8f0;
    --text: #1a1a2e;
    --accent: #e8344e;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12121c;
      --text: #f5f1ea;
      --accent: #ff5c74;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12121c;
    --text: #f5f1ea;
    --accent: #ff5c74;
    color-scheme: dark;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Poppins", "Helvetica Neue", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    cursor: pointer;
  }
  h1 {
    font-size: clamp(2rem, 6vw, 4.5rem);
    font-weight: 800;
    line-height: 1.15;
    text-align: center;
    max-width: 900px;
    padding: 0 1.5rem;
    margin: 0;
    letter-spacing: -0.02em;
    animation: pop 0.9s cubic-bezier(.2,1.4,.4,1) both;
  }
  h1 em { font-style: normal; color: var(--accent); }
  @keyframes pop {
    from { opacity: 0; transform: scale(0.7); }
    to { opacity: 1; transform: scale(1); }
  }
  .hint {
    position: fixed;
    bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
    left: 0; right: 0;
    text-align: center;
    font-size: 0.8rem;
    opacity: 0.45;
  }
  body { flex-direction: column; gap: 1.5rem; }
  .buddies { display: flex; gap: 1.5rem; font-size: clamp(3rem, 10vw, 5.5rem); }
  .buddies span { display: inline-block; animation: dance 0.8s ease-in-out infinite; }
  .buddies span:nth-child(2) { animation-delay: 0.4s; }
  @keyframes dance {
    0%, 100% { transform: translateY(0) rotate(-12deg); }
    50% { transform: translateY(-22px) rotate(12deg); }
  }
  .gif {
    max-width: min(320px, 70vw);
    max-height: 30vh;
    border-radius: 16px;
    animation: pop 0.9s 0.3s cubic-bezier(.2,1.4,.4,1) both;
  }
  canvas { position: fixed; inset: 0; pointer-events: none; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@800&display=swap" rel="stylesheet">
</head>
<body>
<h1>I got a Co-op @ <em>SharkNinja</em> as a Product Design Engineer</h1>
<div class="buddies" aria-hidden="true"><span>🦈</span><span>🥷</span></div>
<img class="gif" src="funny.gif" alt="" onerror="this.style.display='none'">
<div class="hint">tap anywhere for more confetti 🎉</div>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, dpr;
function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener('resize', resize);

const colors = ['#e8344e', '#ffb703', '#06d6a0', '#118ab2', '#9b5de5', '#ff7b00', '#f15bb5'];
let pieces = [];

function burst(x, y, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 6 + Math.random() * 14;
    pieces.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 6,
      w: 6 + Math.random() * 8,
      h: 4 + Math.random() * 6,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.4,
      color: colors[Math.floor(Math.random() * colors.length)],
      life: 0,
      circle: Math.random() < 0.25
    });
  }
  if (!running) { running = true; requestAnimationFrame(tick); }
}

let running = false;
function tick() {
  ctx.clearRect(0, 0, W, H);
  pieces = pieces.filter(p => p.y < H + 40 && p.life < 400);
  for (const p of pieces) {
    p.vx *= 0.985;
    p.vy = p.vy * 0.985 + 0.35;
    p.x += p.vx; p.y += p.vy;
    p.rot += p.vr; p.life++;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = Math.max(0, 1 - p.life / 400);
    if (p.circle) { ctx.beginPath(); ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2); ctx.fill(); }
    else ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    ctx.restore();
  }
  if (pieces.length) requestAnimationFrame(tick);
  else { running = false; ctx.clearRect(0, 0, W, H); }
}

function celebrate() {
  burst(W / 2, H / 2, 160);
  setTimeout(() => burst(W * 0.15, H * 0.8, 90), 250);
  setTimeout(() => burst(W * 0.85, H * 0.8, 90), 400);
  setTimeout(() => burst(W / 2, H * 0.3, 100), 700);
}

window.addEventListener('load', () => setTimeout(celebrate, 300));
document.body.addEventListener('pointerdown', e => burst(e.clientX, e.clientY, 80));
</script>
</body>
</html>
